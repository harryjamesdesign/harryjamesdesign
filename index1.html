<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fancy Registration</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle, #1b1b2f 0%, #162447 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      animation: fadeIn 1s ease-in-out;
    }

    .register-box {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      padding: 40px;
      border-radius: 20px;
      width: 360px;
      box-shadow: 0 0 20px #0f3460;
      animation: floatUp 1s ease forwards;
    }

    .register-box h2 {
      text-align: center;
      color: #ffffff;
      margin-bottom: 25px;
      animation: fadeSlide 0.6s ease forwards;
    }

    .input-group {
      position: relative;
      margin-bottom: 25px;
      animation: fadeSlide 0.5s ease forwards;
    }

    .input-group input {
      width: 100%;
      padding: 14px 12px;
      background: transparent;
      border: 2px solid #ffffff50;
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }

    .input-group label {
      position: absolute;
      top: 50%;
      left: 12px;
      transform: translateY(-50%);
      color: #aaa;
      pointer-events: none;
      transition: 0.3s;
    }

    .input-group input:focus,
    .input-group input:not(:placeholder-shown) {
      border-color: #0f0fff;
    }

    .input-group input:focus+label,
    .input-group input:not(:placeholder-shown)+label {
      top: -10px;
      left: 10px;
      font-size: 12px;
      color: #0f0fff;
      background-color: #1b1b2f;
      padding: 0 4px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      background: linear-gradient(90deg, #6c63ff, #00bcd4);
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 20px #6c63ff70;
      transition: 0.4s;
      animation: fadeSlide 0.8s ease forwards;
    }

    .btn:hover {
      transform: scale(1.03);
      box-shadow: 0 0 25px #00bcd4aa;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes floatUp {
      from {
        transform: translateY(50px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes fadeSlide {
      0% {
        opacity: 0;
        transform: translateY(15px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shake {
      0% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-5px);
      }

      50% {
        transform: translateX(5px);
      }

      75% {
        transform: translateX(-5px);
      }

      100% {
        transform: translateX(0);
      }
    }

    .error input {
      border-color: #ff1744;
      animation: shake 0.3s;
    }

    .error label {
      color: #ff1744;
    }
  </style>
</head>

<body>
  <div class="register-box">
    <h2>Register Now</h2>
    <form id="regForm">
      <div class="input-group">
        <input type="text" id="name" required placeholder=" " />
        <label for="name">Full Name</label>
      </div>
      <div class="input-group">
        <input type="email" id="email" required placeholder=" " />
        <label for="email">Email</label>
      </div>
      <div class="input-group">
        <input type="password" id="pass" required placeholder=" " />
        <label for="pass">Password</label>
      </div>
      <div class="input-group">
        <input type="password" id="confirm" required placeholder=" " />
        <label for="confirm">Confirm Password</label>
      </div>
      <button type="submit" class="btn">Create Account</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('regForm');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const pass = document.getElementById('pass');
      const confirm = document.getElementById('confirm');
      if (pass.value !== confirm.value) {
        [pass, confirm].forEach(input => {
          input.parentElement.classList.add('error');
          setTimeout(() => input.parentElement.classList.remove('error'), 500);
        });
      } else {
        alert('Registered successfully!');
      }
    });
  </script>
</body>

</html>
